[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl2vla"
version = "0.1.0"
description = "Reinforcement Learning with Entropy-Aware Value Injection for VLA generalization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "RL2VLA Authors"}
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
openvla = [
  "transformers>=4.40",
  "accelerate>=0.28",
  "peft>=0.10",
]

[tool.setuptools.packages.find]
include = ["rl2vla*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
